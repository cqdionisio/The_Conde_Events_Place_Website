  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Lato:wght@400;700&display=swap" rel="stylesheet">

  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>

        <!-- ===== CONTACT DETAILS (from js/config.js > business) ===== -->
        <aside class="side-card" aria-labelledby="contact-title">
          <h2 id="contact-title">Prefer to talk?</h2>
          <p>Reach us directly using the details below.</p>
           <ul class="contact-list">
            <li><span class="ci" aria-hidden="true"><img class="all-icon" src="assets/icons/contact-pin.svg" alt="" width="20" height="20"></span><address class="address-block" data-bind="business.address"></address></li>
            <li><span class="ci" aria-hidden="true"><img class="all-icon" src="assets/icons/contact-phone.svg" alt="" width="20" height="20"></span><a data-link="tel" data-bind="business.phoneDisplay" href="#"></a></li>
            <li><span class="ci" aria-hidden="true"><img class="all-icon" src="assets/icons/contact-email.svg" alt="" width="20" height="20"></span><a data-link="mail" data-bind="business.email" href="#"></a></li>
            <li data-link-wrap="facebook"><span class="ci" aria-hidden="true"><img class="all-icon" src="assets/icons/facebook.svg" alt="" width="20" height="20"></span><a data-link="facebook" href="#" target="_blank" rel="noopener">Facebook Page </a></li>

          <div class="map-wrap" data-render="map"></div>
